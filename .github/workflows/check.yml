name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node tools/sim.mjs 2 4
      - run: node tools/sim.mjs 1 1 stress 300
